name: "Satubinha - Push Dev"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Run tests
        run: npm run test:ci
        working-directory: api
        env:
          NODE_ENV: test

      - name: Trivy - filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          scan-ref: 'api'

  release:
    name: "Release"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version:   ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Semantic Release
        if: github.event_name != 'workflow_dispatch'
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver versao
        id: version
        run: |
          if [[ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]]; then
            echo "value=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(cat VERSION)" >> $GITHUB_OUTPUT
          fi

  changes:
    name: "Detect Changes"
    needs: release
    if: needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      api:      ${{ steps.result.outputs.api }}
      front:    ${{ steps.result.outputs.front }}
      weather:  ${{ steps.result.outputs.weather }}
      database: ${{ steps.result.outputs.database }}
      migrate:  ${{ steps.result.outputs.migrate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            front:
              - 'front/**'
            weather:
              - 'weather/**'
            database:
              - 'database/**'
            migrate:
              - 'migrate/**'

      - name: Consolidar outputs
        id: result
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "api=false"      >> $GITHUB_OUTPUT
            echo "front=false"    >> $GITHUB_OUTPUT
            echo "weather=false"  >> $GITHUB_OUTPUT
            echo "database=false" >> $GITHUB_OUTPUT
            echo "migrate=false"  >> $GITHUB_OUTPUT
          else
            echo "api=${{ steps.filter.outputs.api }}"           >> $GITHUB_OUTPUT
            echo "front=${{ steps.filter.outputs.front }}"       >> $GITHUB_OUTPUT
            echo "weather=${{ steps.filter.outputs.weather }}"   >> $GITHUB_OUTPUT
            echo "database=${{ steps.filter.outputs.database }}" >> $GITHUB_OUTPUT
            echo "migrate=${{ steps.filter.outputs.migrate }}"   >> $GITHUB_OUTPUT
          fi

  build:
    name: "Build - ${{ matrix.service }}"
    needs: [release, changes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: build-satubinha-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - service: front
            context: ./front
            dockerfile: ./front/Dockerfile
          - service: weather
            context: ./weather
            dockerfile: ./weather/Dockerfile
          - service: database
            context: ./database
            dockerfile: ./database/Dockerfile
          - service: migrate
            context: ./migrate
            dockerfile: ./migrate/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Verificar alteracoes no servico
        id: changed
        run: |
          declare -A map
          map[api]="${{ needs.changes.outputs.api }}"
          map[front]="${{ needs.changes.outputs.front }}"
          map[weather]="${{ needs.changes.outputs.weather }}"
          map[database]="${{ needs.changes.outputs.database }}"
          map[migrate]="${{ needs.changes.outputs.migrate }}"
          echo "value=${map[${{ matrix.service }}]}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verificar imagem no ECR
        id: check-ecr
        uses: mnmandahalf/check-ecr-image-exists@v0.1.5
        with:
          repository-name: 'satubinha-app-img-stables'
          image-tag: '${{ matrix.service }}-v${{ needs.release.outputs.version }}'
          region: 'us-east-1'

      - name: Determinar acao
        id: action
        run: |
          IMAGE_EXISTS="${{ steps.check-ecr.outputs.image-exists }}"
          CHANGED="${{ steps.changed.outputs.value }}"

          if [[ "$IMAGE_EXISTS" == "1" && "$CHANGED" != "true" ]]; then
            echo "Imagem ${{ matrix.service }}-v${{ needs.release.outputs.version }} ja existe e sem alteracoes — ignorando."
            echo "build=false" >> $GITHUB_OUTPUT
          elif [[ "$IMAGE_EXISTS" == "1" && "$CHANGED" == "true" ]]; then
            echo "Imagem existe mas ha alteracoes — nova versao sera gerada pelo semantic-release no proximo ciclo."
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "Imagem nao encontrada no ECR — iniciando build."
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - name: Instalar Cosign
        if: steps.action.outputs.build == 'true'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Build e push imagem
        if: steps.action.outputs.build == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: satubinha-app-img-stables
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          VERSION_TAG="$SERVICE-v$VERSION"
          LATEST_TAG="$SERVICE-latest"

          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }}

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG

          IMAGE_DIGEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$VERSION_TAG \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          cosign sign --yes $ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST

          aws ssm put-parameter \
            --name "/satubinha/images/$SERVICE" \
            --value "v$VERSION" \
            --type "String" \
            --overwrite \
            --region us-east-1
