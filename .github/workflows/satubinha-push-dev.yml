name: "Satubinha - Push Dev"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: 'Servico para build'
        type: choice
        default: all
        options:
          - all
          - api
          - front
          - weather
          - database
          - migrate

jobs:

  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Run tests
        run: npm run test:ci
        working-directory: api
        env:
          NODE_ENV: test

      - name: Trivy - filesystem scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0  # v0.29.0
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          scan-ref: 'api'

  changes:
    name: "Detect Changes"
    needs: test
    runs-on: ubuntu-latest
    outputs:
      api:      ${{ steps.result.outputs.api }}
      front:    ${{ steps.result.outputs.front }}
      weather:  ${{ steps.result.outputs.weather }}
      database: ${{ steps.result.outputs.database }}
      migrate:  ${{ steps.result.outputs.migrate }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            front:
              - 'front/**'
            weather:
              - 'weather/**'
            database:
              - 'database/**'
            migrate:
              - 'migrate/**'

      - name: Consolidar outputs
        id: result
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SERVICE="${{ inputs.service }}"
            echo "api=$(    [[ "$SERVICE" == "all" || "$SERVICE" == "api"      ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "front=$(  [[ "$SERVICE" == "all" || "$SERVICE" == "front"    ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "weather=$([[ "$SERVICE" == "all" || "$SERVICE" == "weather"  ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "database=$([[ "$SERVICE" == "all" || "$SERVICE" == "database"]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "migrate=$([[ "$SERVICE" == "all" || "$SERVICE" == "migrate"  ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          else
            echo "api=${{ steps.filter.outputs.api }}"           >> $GITHUB_OUTPUT
            echo "front=${{ steps.filter.outputs.front }}"       >> $GITHUB_OUTPUT
            echo "weather=${{ steps.filter.outputs.weather }}"   >> $GITHUB_OUTPUT
            echo "database=${{ steps.filter.outputs.database }}" >> $GITHUB_OUTPUT
            echo "migrate=${{ steps.filter.outputs.migrate }}"   >> $GITHUB_OUTPUT
          fi

  build:
    name: "Build - ${{ matrix.service }}"
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: build-satubinha-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            dockerfile: ./api/Dockerfile
            ecr_repo: satubinha-api
          - service: front
            context: ./front
            dockerfile: ./front/Dockerfile
            ecr_repo: satubinha-front
          - service: weather
            context: ./weather
            dockerfile: ./weather/Dockerfile
            ecr_repo: satubinha-weather
          - service: database
            context: ./database
            dockerfile: ./database/Dockerfile
            ecr_repo: satubinha-database
          - service: migrate
            context: ./migrate
            dockerfile: ./migrate/Dockerfile
            ecr_repo: satubinha-migrate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Verificar alteracoes no servico
        id: changed
        run: |
          declare -A map
          map[api]="${{ needs.changes.outputs.api }}"
          map[front]="${{ needs.changes.outputs.front }}"
          map[weather]="${{ needs.changes.outputs.weather }}"
          map[database]="${{ needs.changes.outputs.database }}"
          map[migrate]="${{ needs.changes.outputs.migrate }}"
          echo "value=${map[${{ matrix.service }}]}" >> $GITHUB_OUTPUT

      - name: Calcular short SHA
        if: steps.changed.outputs.value == 'true'
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        if: steps.changed.outputs.value == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Instalar Cosign
        if: steps.changed.outputs.value == 'true'
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1

      - name: Build imagem
        if: steps.changed.outputs.value == 'true'
        run: |
          docker build \
            -t ${{ matrix.ecr_repo }}:sha-${{ steps.sha.outputs.short }} \
            -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      - name: Trivy - scan imagem
        if: steps.changed.outputs.value == 'true'
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0  # v0.29.0
        with:
          scan-type: 'image'
          image-ref: '${{ matrix.ecr_repo }}:sha-${{ steps.sha.outputs.short }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Push e assinar imagem
        if: steps.changed.outputs.value == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: ${{ matrix.ecr_repo }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          SHA_TAG="sha-$SHORT_SHA"

          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

          docker tag $ECR_REPOSITORY:$SHA_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG

          IMAGE_DIGEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$SHA_TAG \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          cosign sign --yes $ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST

          aws ssm put-parameter \
            --name "/satubinha/images/${{ matrix.service }}" \
            --value "$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG" \
            --type "String" \
            --overwrite \
            --region us-east-1
