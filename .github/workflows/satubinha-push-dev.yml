name: "Satubinha - Push Dev"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: "Satubinha - Run Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Run tests
        run: npm run test:ci
        working-directory: api
        env:
          NODE_ENV: test

      - name: Trivy - filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          scan-ref: 'api'

  build:
    name: "Build - ${{ matrix.service }}"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: dev-satubinha-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - service: front
            context: ./front
            dockerfile: ./front/Dockerfile
          - service: database
            context: ./database
            dockerfile: ./database/Dockerfile
          - service: migrate
            context: ./migrate
            dockerfile: ./migrate/Dockerfile
          - service: weather
            context: ./weather
            dockerfile: ./weather/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          VERSION=$(cat VERSION)
          echo "tag=${{ matrix.service }}-$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - id: check-ecr
        uses: mnmandahalf/check-ecr-image-exists@v0.1.5
        with:
          repository-name: 'satubinha-app-img-stables'
          image-tag: '${{ steps.vars.outputs.tag }}'
          region: 'us-east-1'

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Build e push imagem
        if: steps.check-ecr.outputs.image-exists == '0'
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: 'satubinha-app-img-stables'
          IMAGE_TAG: '${{ steps.vars.outputs.tag }}'
        run: |
          echo "A imagem não existe — fazendo build e push."
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ${{ matrix.dockerfile }} ${{ matrix.context }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          IMAGE_DIGEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          cosign sign --yes $ECR_REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST

          aws ssm put-parameter \
            --name "/satubinha/images/${{ matrix.service }}" \
            --value "${{ steps.vars.outputs.version }}" \
            --type "String" \
            --overwrite \
            --region us-east-1

      - name: Imagem já existe
        if: steps.check-ecr.outputs.image-exists == '1'
        run: |
            echo "Imagem $IMAGE_TAG ja existe no ECR — ignorando."
        env:
            IMAGE_TAG: '${{ steps.vars.outputs.tag }}'
          